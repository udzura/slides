</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="section" data-theme="kaigi-on-rails-2026" lang="ja-JP" class="section" data-marpit-pagination="7" style="--paginate:true;--class:section;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="rails-and-file-upload">Rails and File Upload</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="8" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="what-is-file-upload">What is File upload</h1>
<ul>
<li>File upload is one of the most basic requirements of a web service.</li>
<li>Ruby on Rails supports it, of course.</li>
<li>That's <strong>ActiveStorage</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="9" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="ba-before-activestorage">B.A. (Before ActiveStorage)</h1>
<ul>
<li>But until ActiveStorage arrived, no rails had been laid for files.</li>
<li>A short history and tour of the libraries.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="section" data-theme="kaigi-on-rails-2026" lang="ja-JP" class="section" data-marpit-pagination="10" style="--paginate:true;--class:section;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="the-situation-at-smarthr">The Situation at SmartHR</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="11" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="when-something-is-done">When something is done</h1>
<ul>
<li>The HR/labor management application at SmartHR got its first commit around 2015.</li>
<li>A world before ActiveStorage.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="12" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="the-choice">The choice</h1>
<ul>
<li>So we had to pick a gem. That gem was CarrierWave.</li>
<li>And then, ten years went by.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="13" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="smell-of-the-legacy">Smell of the legacy</h1>
<ul>
<li>We ran CarrierWave for almost ten years, and slowly what we wanted drifted away from what the gem could do.</li>
<li>One of them: how badly it fit the data model at the core of our product — the bitemporal data model.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="14" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="in-a-bitemporal-data-model">In a bitemporal data model...</h1>
<ul>
<li>Data is never deleted. So files should not be deleted either.</li>
<li>We have to control CarrierWave's habit of deleting the file on destroy.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="15" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="in-a-bitemporal-data-model-1">In a bitemporal data model...</h1>
<ul>
<li>A &quot;history&quot; holding the same image can get split.</li>
<li>Which, in an unlucky combination, made the upload run all over again.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="section-plain" data-theme="kaigi-on-rails-2026" lang="ja-JP" class="section-plain" data-marpit-pagination="16" style="--paginate:true;--class:section-plain;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="on-top-of-that-several-problems-came-up">On top of that, several problems came up</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="17" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="path-resolution-kept-getting-more-complex">Path resolution kept getting more complex</h1>
<ul>
<li>It was complex enough that it broke, easily, again and again.</li>
<li>And when we tried to change it years later, backward compatibility forced dirty time-based if statements on us.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="18" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="synchronous-generation-of-resized-variants">Synchronous generation of resized variants</h1>
<ul>
<li>CarrierWave can generate resized versions of an image</li>
</ul>
<pre><code class="language-ruby">version <span class="hljs-symbol">:large</span>, ...
</code></pre>
<ul>
<li>Some models declare several versions, and generate every one of them synchronously</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="19" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="exif-handling">EXIF handling</h1>
<ul>
<li>Inside CarrierWave, we process the image's EXIF data on upload
<ul>
<li>Rotation</li>
<li>Stripping location and other personal data</li>
</ul>
</li>
<li>What the spec should be was never clear, and it cost us performance</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="20" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="bi-temporal-model-restriction">Bi-temporal model restriction</h1>
<ul>
<li>Combine a &quot;history split&quot; with synchronous variant generation, and a single update could fire an absurd number of uploads.</li>
<li>On top of that, piling complex responsibilities onto the uploader meant we could no longer read what an update would touch.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="section-plain" data-theme="kaigi-on-rails-2026" lang="ja-JP" class="section-plain" data-marpit-pagination="21" style="--paginate:true;--class:section-plain;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="all-of-it-tangled-together-into-debt">All of it tangled together into debt.</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="section" data-theme="kaigi-on-rails-2026" lang="ja-JP" class="section" data-marpit-pagination="22" style="--paginate:true;--class:section;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="untangling-the-problem">Untangling the Problem</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-class="body" data-theme="kaigi-on-rails-2026" lang="ja-JP" class="body" data-marpit-pagination="23" style="--paginate:true;--class:body;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<ul>
<li>So what do we do?</li>
<li>Our team took the approach of untangling the responsibilities.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="24" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="what-we-did-about-path-resolution">What we did about path resolution</h1>
<ul>
<li>Work to pin down the cache path and the persisted path</li>
<li>A quick word on the lifecycle</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="25" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="synchronous-generation-of-resized-variants-1">Synchronous generation of resized variants</h1>
<ul>
<li>Extracted a service that generates the variants reactively</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="26" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="exif-handling-1">EXIF handling</h1>
<ul>
<li>Dropped the rotation we never needed, moved the stripping off the request</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="section-plain" data-theme="kaigi-on-rails-2026" lang="ja-JP" class="section-plain" data-marpit-pagination="27" style="--paginate:true;--class:section-plain;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="simplify-the-spec-take-off-the-model-what-it-should-never-have-carried">Simplify the spec, take off the model what it should never have carried</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="28" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="by-the-way-what-about-bi-temporals-and-performance">By the way, what about bi-temporals and performance?</h1>
<ul>
<li>We added a path that skips the upload when a &quot;history split&quot; happens.</li>
<li>It can only be hacky code built on CurrentAttributes, but it holds for now.</li>
<li>This one adds complexity, so we are torn. A stopgap, with replacement in mind.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="section" data-theme="kaigi-on-rails-2026" lang="ja-JP" class="section" data-marpit-pagination="29" style="--paginate:true;--class:section;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="the-future-of-file-upload">The Future of File Upload</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="30" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="the-ideal-and-the-reality">The ideal and the reality</h1>
<ul>
<li>In the end, we should also ask whether to drop CarrierWave.</li>
<li>First: now that the responsibilities are untangled, an upgrade is at least on the table.</li>
<li>Still, how it fits our history model is as bad as ever.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="section-plain" data-theme="kaigi-on-rails-2026" lang="ja-JP" class="section-plain" data-marpit-pagination="31" style="--paginate:true;--class:section-plain;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="and-if-we-leave-where-do-we-go">And if we leave, where do we go?</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="32" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="activestorage">ActiveStorage?</h1>
<ul>
<li>It needs a join to associate with a model, and in our tables one model often points at five or six images. Performance looks rough. Not a straightforward move.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="33" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="another-library-like-shrine">Another library, like Shrine?</h1>
<ul>
<li>Shrine actually has no official GCS support.</li>
<li>Plugin-based, every step loosely coupled — that is strong. But it also means building a lot in-house.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="34" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="our-own-library">Our own library...?</h1>
<ul>
<li>Given how it tangles with history, and the rise of AI, maybe this is an option we should not throw out after all.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="section" data-theme="kaigi-on-rails-2026" lang="ja-JP" class="section" data-marpit-pagination="35" style="--paginate:true;--class:section;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="conclusion">Conclusion</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="kaigi-on-rails-2026" lang="ja-JP" data-marpit-pagination="36" style="--paginate:true;--theme:kaigi-on-rails-2026;" data-marpit-pagination-total="36">
<h1 id="for-all-rails-developers-who-struggle">For all Rails developers who struggle</h1>
<ul>
<li>Honestly, we have not reached a conclusion yet.</li>
<li>But I have told you one story, hoping it gives programmers fighting the same fight something to think with.</li>
</ul>
</section>
