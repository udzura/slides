<text x="90" y="297" font-size="23" fill="#fff" font-weight="400">Write</text>
<rect x="260" y="180" width="120" height="82" rx="10" fill="#333" stroke="#aaa" stroke-width="2"/>
<text x="320" y="229" font-size="24" fill="#fff" font-weight="700">AI (main)</text>
<text x="320" y="297" font-size="23" fill="#fff" font-weight="400">Structure</text>
