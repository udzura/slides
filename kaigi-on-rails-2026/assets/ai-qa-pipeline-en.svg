<text x="780" y="229" font-size="24" fill="#fff" font-weight="700">AI (main)</text>
<text x="780" y="297" font-size="23" fill="#fff" font-weight="400">Build report</text>
<rect x="950" y="180" width="120" height="82" rx="10" fill="#333" stroke="#aaa" stroke-width="2"/>
<text x="1010" y="229" font-size="24" fill="#fff" font-weight="700">Human</text>
<text x="1010" y="297" font-size="23" fill="#fff" font-weight="400">Review</text>
<rect x="102" y="64" width="206" height="77" rx="25" fill="#343b20" stroke="#ceff05" stroke-width="2"/>
