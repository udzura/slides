<path d="M388 221 H474" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="562" y="64" width="206" height="77" rx="25" fill="#343b20" stroke="#ceff05" stroke-width="2"/>
