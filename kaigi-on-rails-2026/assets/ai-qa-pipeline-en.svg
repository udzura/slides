<text x="550" y="229" font-size="24" fill="#fff" font-weight="700">AI (sub)</text>
<text x="550" y="297" font-size="23" fill="#fff" font-weight="400">Test</text>
<text x="550" y="325" font-size="21" fill="#ccc" font-weight="400">Playwright</text>
