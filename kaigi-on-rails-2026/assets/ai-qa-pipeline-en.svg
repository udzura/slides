<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">AI QA: transforming artifacts</title>
<desc id="desc">Features to test become a human-written User Story. The main AI structures it as scenario.yml. A sub-agent tests it with Playwright and produces result.yml. The main AI converts results into a human-readable report, which a human reviews to approve or reject.</desc>
