<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">cache_path固定：変更以後</title>
<desc id="desc">cache作成時にIDとパスAの対応をRedisへ記録。復元時には再計算せず、同じIDでRedisを引き、パスAのファイルへアクセスする。</desc>
<style>
/* Hover effect: works only when embedded as an object element in a browser. Static in PDF and images. */
.box { --glow: #ceff05; --hover-fill: #3a4422; transform-box: fill-box; transform-origin: center; transition: transform .2s ease, filter .2s ease; }
.box.gray { --glow: #ffffff; --hover-fill: #444444; }
.box.pink { --glow: #ff58af; --hover-fill: #4a2a3f; }
.box rect { transition: fill .2s ease; }
.box:hover { transform: scale(1.04); filter: drop-shadow(0 0 10px var(--glow)); }
.box:hover rect { fill: var(--hover-fill); }
@media (prefers-reduced-motion: reduce) { .box, .box rect { transition: none; } .box:hover { transform: none; } }
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ceff05" /></marker></defs><rect width="1100" height="460" rx="16" fill="#202020" fill-opacity="0.75" /><g font-family="'Noto Sans JP','Hiragino Sans',sans-serif" text-anchor="middle" fill="#fff">
<text x="155" y="43" font-size="25" fill="#ceff05" font-weight="700">① cache作成時</text>
<text x="155" y="241" font-size="25" fill="#ceff05" font-weight="700">② 復元時</text>
<g class="box gray"><rect x="35" y="65" width="230" height="100" rx="10" fill="#2f2f2f" stroke="#aaa" stroke-width="2" />
<text x="150" y="104" font-size="23" fill="#fff" font-weight="400">キャッシュID</text>
<text x="150" y="141" font-size="25" fill="#ceff05" font-weight="700">同じID：C123</text>
</g><g class="box"><rect x="365" y="65" width="350" height="100" rx="10" fill="#2f2f2f" stroke="#ceff05" stroke-width="2" />
<text x="540" y="103" font-size="25" fill="#ceff05" font-weight="700">Redisへ対応を記録</text>
<text x="540" y="140" font-size="24" fill="#fff" font-weight="400">C123 → パスA</text>
</g><g class="box"><rect x="820" y="65" width="245" height="100" rx="10" fill="#2f2f2f" stroke="#ceff05" stroke-width="2" />
<text x="942" y="104" font-size="27" fill="#ceff05" font-weight="700">パスA</text>
<text x="942" y="141" font-size="21" fill="#fff" font-weight="400">ファイルを保存</text>
</g><path d="M265 115 H361" fill="none" stroke="#ceff05" stroke-width="3" marker-end="url(#arrow)" />
<path d="M715 115 H816" fill="none" stroke="#ceff05" stroke-width="3" marker-end="url(#arrow)" />
<g class="box gray"><rect x="35" y="260" width="230" height="100" rx="10" fill="#2f2f2f" stroke="#aaa" stroke-width="2" />
<text x="150" y="299" font-size="23" fill="#fff" font-weight="400">キャッシュID</text>
<text x="150" y="336" font-size="25" fill="#ceff05" font-weight="700">同じID：C123</text>
</g><g class="box"><rect x="365" y="260" width="350" height="100" rx="10" fill="#2f2f2f" stroke="#ceff05" stroke-width="2" />
<text x="540" y="298" font-size="25" fill="#ceff05" font-weight="700">Redisから取得</text>
<text x="540" y="335" font-size="24" fill="#fff" font-weight="400">C123 → パスA</text>
</g><g class="box"><rect x="820" y="260" width="245" height="100" rx="10" fill="#2f2f2f" stroke="#ceff05" stroke-width="2" />
<text x="942" y="299" font-size="27" fill="#ceff05" font-weight="700">パスA</text>
<text x="942" y="336" font-size="21" fill="#fff" font-weight="400">同じファイルを復元</text>
</g><path d="M265 310 H361" fill="none" stroke="#ceff05" stroke-width="3" marker-end="url(#arrow)" />
<path d="M715 310 H816" fill="none" stroke="#ceff05" stroke-width="3" marker-end="url(#arrow)" />
<path d="M540 165 V256" fill="none" stroke="#ceff05" stroke-width="3" marker-end="url(#arrow)" />
<text x="738" y="210" font-size="20" fill="#ceff05" font-weight="400">保存した対応を使う</text>
<text x="550" y="408" font-size="26" fill="#ceff05" font-weight="700">計算するのは作成時だけ。復元時は記録したパスを使う</text>
<text x="550" y="441" font-size="17" fill="#bbb" font-weight="400">概念図：ID・パス名は説明用。IDはキャッシュの識別子で、モデルのIDとは別。</text>
</g></svg>