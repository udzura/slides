<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><style>
/* Hover effect: works only when embedded as an object element in a browser. Static in PDF and images. */
.box { --glow: #ceff05; --hover-fill: #3a4422; transform-box: fill-box; transform-origin: center; transition: transform .2s ease, filter .2s ease; }
.box.gray { --glow: #ffffff; --hover-fill: #444444; }
.box.pink { --glow: #ff58af; --hover-fill: #4a2a3f; }
.box &gt; rect { transition: fill .2s ease; }
.box:hover:not(:has(.box:hover)) { transform: scale(1.04); filter: drop-shadow(0 0 10px var(--glow)); }
.box:hover:not(:has(.box:hover)) &gt; rect { fill: var(--hover-fill); }
@media (prefers-reduced-motion: reduce) { .box, .box &gt; rect { transition: none; } .box:hover { transform: none; } }
</style><title id="title">Reliability comes first</title><desc id="desc">Three qualities side by side: Reliability is the top priority, followed by future work on Maintainability and Security, and Usability.</desc><rect width="1100" height="460" rx="18" fill="#202020" fill-opacity="0.94" /><g font-family="Arial, sans-serif" text-anchor="middle"><g class="box"><rect x="25" y="107" width="320" height="278" rx="18" fill="#30391c" stroke="#ceff05" stroke-width="3" /><text x="185" y="163" font-size="35" fill="#ceff05" font-weight="700">Reliability</text><path d="M53 211 H317" stroke="#ceff05" /><text x="185" y="264" font-size="24" fill="#fff" font-weight="400">cache_path: done</text><text x="185" y="306" font-size="24" fill="#fff" font-weight="400">store_path: partly done</text><text x="185" y="354" font-size="22" fill="#ceff05" font-weight="700">Stabilize file access first</text></g><rect x="72" y="33" width="226" height="49" rx="24" fill="#ceff05" /><text x="185" y="66" font-size="23" fill="#202020" font-weight="700">TOP PRIORITY</text><path d="M185 88 V101" stroke="#ceff05" stroke-width="3" /><g class="box pink"><rect x="390" y="107" width="320" height="278" rx="18" fill="#432539" stroke="#ff58af" stroke-width="2" /><text x="550" y="153" font-size="29" fill="#ff58af" font-weight="700">Maintainability</text><text x="550" y="189" font-size="27" fill="#ff58af" font-weight="700">/ Security</text><path d="M418 211 H682" stroke="#ff58af" /><text x="550" y="264" font-size="24" fill="#fff" font-weight="400">Compatibility layer</text><text x="550" y="306" font-size="24" fill="#fff" font-weight="400">Analysis in progress</text></g><g class="box pink"><rect x="755" y="107" width="320" height="278" rx="18" fill="#432539" stroke="#ff58af" stroke-width="2" /><text x="915" y="163" font-size="35" fill="#ff58af" font-weight="700">Usability</text><path d="M783 211 H1047" stroke="#ff58af" /><text x="915" y="264" font-size="24" fill="#fff" font-weight="400">External image service</text><text x="915" y="306" font-size="24" fill="#fff" font-weight="400">PoC in progress</text></g><text x="550" y="429" font-size="24" fill="#fff" font-weight="400">Start with reliability. Build a foundation for the next improvements.</text></g></svg>