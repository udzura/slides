<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <style>
/* Flow effect: arrows march while the pointer is on the diagram. */
svg:hover .flow { stroke-dasharray: 12 6; animation: flow .8s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -18; } }
@media (prefers-reduced-motion: reduce) { svg:hover .flow { animation: none; stroke-dasharray: none; } }

/* Hover effect: works only when embedded as an object element in a browser. Static in PDF and images. */
.box { --glow: #ceff05; --hover-fill: #3a4422; transform-box: fill-box; transform-origin: center; transition: transform .2s ease, filter .2s ease; }
.box.gray { --glow: #ffffff; --hover-fill: #444444; }
.box.pink { --glow: #ff58af; --hover-fill: #4a2a3f; }
.box &gt; rect { transition: fill .2s ease; }
.box:hover:not(:has(.box:hover)) { transform: scale(1.04); filter: drop-shadow(0 0 10px var(--glow)); }
.box:hover:not(:has(.box:hover)) &gt; rect { fill: var(--hover-fill); }
@media (prefers-reduced-motion: reduce) { .box, .box &gt; rect { transition: none; } .box:hover { transform: none; } }
</style><title id="title">Skip uploads during history copying</title>
  <desc id="desc">Proposed improvement: copy the history row and perform the internal assignment, but skip the upload when bitemporal operations are marked as in progress. CurrentAttributes carries the state into hooks.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ceff05" /></marker>
    <marker id="pink-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ff58af" /></marker>
  </defs>
  <rect width="1100" height="390" rx="20" fill="#202020" fill-opacity="0.94" />
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff">
    <text x="800" y="45" font-size="24" font-weight="700" fill="#ff58af">When marked:</text>
    <text x="800" y="77" font-size="24" fill="#ff58af">Bitemporal ops in progress</text>
    <text x="232" y="59" font-size="29" font-weight="700" fill="#ceff05">Copy history</text>
    <g class="box gray"><rect x="30" y="113" width="174" height="150" rx="12" fill="#2f2f2f" stroke="#aaa" stroke-width="2" />
    <text x="117" y="158" font-size="25" font-weight="700">Previous row</text>
    <text x="117" y="218" font-size="23">photo.jpg</text>
    </g><path d="M216 188 H255" stroke="#ceff05" stroke-width="3" marker-end="url(#arrow)" class="flow" />
    <text x="235" y="166" font-size="17" fill="#ceff05">copy</text>
    <g class="box"><rect x="269" y="113" width="174" height="150" rx="12" fill="#30391c" stroke="#ceff05" stroke-width="2" />
    <text x="356" y="158" font-size="25" font-weight="700">New row</text>
    <text x="356" y="218" font-size="23">photo.jpg</text>
    </g><text x="232" y="340" font-size="24">Same file</text>
    <circle cx="235" cy="188" r="4" fill="#ceff05" />
    <path d="M235 188 V285 Q235 297 247 297 H478 Q490 297 490 285 V200 Q490 188 502 188 H518" fill="none" stroke="#ceff05" stroke-width="3" marker-end="url(#arrow)" class="flow" />
    <g class="box gray"><rect x="526" y="113" width="235" height="150" rx="12" fill="#2f2f2f" stroke="#aaa" stroke-width="2" />
    <text x="643" y="154" font-size="25" font-weight="700">Internal assign</text>
    <text x="643" y="201" font-size="21">Mounted attribute</text>
    <text x="643" y="231" font-size="21">receives the file</text>
    </g><path d="M777 188 H829" stroke="#aaa" stroke-width="3" marker-end="url(#pink-arrow)" class="flow" />
    <path d="M776 139 L832 237 M832 139 L776 237" fill="none" stroke="#ff58af" stroke-width="5" stroke-linecap="round" />
    <g class="box gray"><rect x="845" y="113" width="225" height="150" rx="12" fill="#2f2f2f" stroke="#777" stroke-width="2" />
    <text x="957" y="157" font-size="29" font-weight="700" fill="#ff58af">Upload</text>
    <text x="957" y="216" font-size="30" font-family="monospace">cache!</text>
    </g><text x="957" y="307" font-size="24" fill="#ff58af">Skipped</text>
  </g>
</svg>