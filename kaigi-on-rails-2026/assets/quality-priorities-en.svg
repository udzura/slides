<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">Reliability comes first</title><desc id="desc">Three qualities side by side: Reliability is the top priority, followed by future work on Maintainability and Security, and Usability.</desc><rect width="1100" height="460" rx="18" fill="#202020" fill-opacity="0.94"/><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="25" y="107" width="320" height="278" rx="18" fill="#30391c" stroke="#ceff05" stroke-width="3"/><rect x="72" y="33" width="226" height="49" rx="24" fill="#ceff05"/><text x="185" y="66" font-size="23" fill="#202020" font-weight="700">TOP PRIORITY</text><path d="M185 88 V101" stroke="#ceff05" stroke-width="3"/><text x="185" y="163" font-size="35" fill="#ceff05" font-weight="700">Reliability</text><path d="M53 211 H317" stroke="#ceff05"/><text x="185" y="264" font-size="24" fill="#fff" font-weight="400">Unstable paths</text><text x="185" y="306" font-size="24" fill="#fff" font-weight="400">Recurring incidents</text><text x="185" y="354" font-size="22" fill="#ceff05" font-weight="700">Stabilize file access first</text><rect x="390" y="107" width="320" height="278" rx="18" fill="#432539" stroke="#ff58af" stroke-width="2"/><text x="550" y="153" font-size="29" fill="#ff58af" font-weight="700">Maintainability</text><text x="550" y="189" font-size="27" fill="#ff58af" font-weight="700">/ Security</text><path d="M418 211 H682" stroke="#ff58af"/><text x="550" y="264" font-size="24" fill="#fff" font-weight="400">Difficult upgrades</text><rect x="755" y="107" width="320" height="278" rx="18" fill="#432539" stroke="#ff58af" stroke-width="2"/><text x="915" y="163" font-size="35" fill="#ff58af" font-weight="700">Usability</text><path d="M783 211 H1047" stroke="#ff58af"/><text x="915" y="264" font-size="24" fill="#fff" font-weight="400">Performance</text><text x="915" y="306" font-size="24" fill="#fff" font-weight="400">Developer productivity</text><text x="550" y="429" font-size="24" fill="#fff" font-weight="400">Start with reliability. Build a foundation for the next improvements.</text></g></svg>