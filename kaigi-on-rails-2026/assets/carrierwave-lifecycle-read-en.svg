<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">Read: from the identifier in the DB to the file</title><desc id="desc">Read: from the identifier in the DB to the file</desc>
<style>
/* Hover effect: works only when embedded as an object element in a browser. Static in PDF and images. */
.box { --glow: #ceff05; --hover-fill: #3a4422; transform-box: fill-box; transform-origin: center; transition: transform .2s ease, filter .2s ease; }
.box.gray { --glow: #ffffff; --hover-fill: #444444; }
.box.pink { --glow: #ff58af; --hover-fill: #4a2a3f; }
.box rect { transition: fill .2s ease; }
.box:hover { transform: scale(1.04); filter: drop-shadow(0 0 10px var(--glow)); }
.box:hover rect { fill: var(--hover-fill); }
@media (prefers-reduced-motion: reduce) { .box, .box rect { transition: none; } .box:hover { transform: none; } }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ceff05"/></marker><marker id="pink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ff58af"/></marker></defs><rect width="1100" height="470" rx="16" fill="#202020" fill-opacity="0.75"/><g font-family="'Noto Sans JP','Hiragino Sans',sans-serif" fill="#fff" text-anchor="middle">
<g class="box"><rect x="255" y="20" width="590" height="80" rx="9" fill="#30391c" stroke="#ceff05" stroke-width="2"/>
<text x="550.0" y="52" font-size="25" fill="#ceff05" font-weight="700">① Read the identifier from the DB</text>
<text x="550.0" y="82" font-size="20" fill="#fff" font-weight="400">Value stored in the model’s column: photo.jpg</text>
</g>
<g class="box"><rect x="255" y="128" width="590" height="80" rx="9" fill="#30391c" stroke="#ceff05" stroke-width="2"/>
<text x="550.0" y="160" font-size="25" fill="#ceff05" font-weight="700">② retrieve_from_store!(identifier)</text>
<text x="550.0" y="190" font-size="20" fill="#fff" font-weight="400">Passes the identifier to the Uploader</text>
</g>
<g class="box"><rect x="255" y="236" width="590" height="80" rx="9" fill="#30391c" stroke="#ceff05" stroke-width="2"/>
<text x="550.0" y="268" font-size="25" fill="#ceff05" font-weight="700">③ Build the storage path</text>
<text x="550.0" y="298" font-size="20" fill="#fff" font-weight="400">store_dir and other info + identifier → store_path</text>
</g>
<g class="box"><rect x="255" y="344" width="590" height="80" rx="9" fill="#30391c" stroke="#ceff05" stroke-width="2"/>
<text x="550.0" y="376" font-size="25" fill="#ceff05" font-weight="700">④ The stored image can be referenced</text>
<text x="550.0" y="406" font-size="20" fill="#fff" font-weight="400">Generate URLs, or read the file when needed</text>
</g>
<path d="M550 100 V126" fill="none" stroke="#ceff05" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M550 208 V234" fill="none" stroke="#ceff05" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M550 316 V342" fill="none" stroke="#ceff05" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="455" font-size="20" fill="#ccc" font-weight="400">retrieve restores a reference; it does not always fetch all the bytes at call time</text>
</g></svg>