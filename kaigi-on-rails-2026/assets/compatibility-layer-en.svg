<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">An API for what SmartHR needs</title>
  <desc id="desc">SmartHR calls a wrapped image operation API to get a name, get image size, and perform other operations. The wrapper contains the CarrierWave API, keeping its details inside the compatibility layer.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ceff05"/></marker>
  </defs>
  <rect width="1100" height="460" rx="18" fill="#202020" fill-opacity="0.94"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff">
    <rect x="35" y="98" width="535" height="268" rx="134" fill="#343b20" stroke="#ceff05" stroke-width="3"/>
    <text x="302" y="151" font-size="29" font-weight="700" fill="#ceff05">Wrapped Image Operation API</text>
    <rect x="91" y="187" width="317" height="137" rx="68" fill="#303030" stroke="#aaa" stroke-width="2"/>
    <text x="249" y="244" font-size="32" font-weight="700">CarrierWave</text>
    <text x="249" y="287" font-size="32">API</text>
    <rect x="852" y="66" width="213" height="332" rx="14" fill="#333" stroke="#ff83bd" stroke-width="2"/>
    <text x="958" y="200" font-size="31" font-weight="700">What</text>
    <text x="958" y="241" font-size="31" font-weight="700" fill="#ff83bd">SmartHR</text>
    <text x="958" y="282" font-size="31" font-weight="700">Needs</text>
    <g fill="none" stroke="#ceff05" stroke-width="3" marker-end="url(#arrow)">
      <path d="M836 149 H579"/>
      <path d="M836 232 H585"/>
      <path d="M836 315 H579"/>
    </g>
    <g fill="#202020">
      <rect x="635" y="130" width="149" height="36" rx="8"/>
      <rect x="600" y="213" width="216" height="36" rx="8"/>
      <rect x="670" y="296" width="78" height="36" rx="8"/>
    </g>
    <text x="709" y="157" font-size="25">get name</text>
    <text x="708" y="240" font-size="25">get image size</text>
    <text x="709" y="323" font-size="25">etc.</text>
  </g>
</svg>
