<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <style>
/* Hover effect: works only when embedded as an object element in a browser. Static in PDF and images. */
.box { --glow: #ceff05; --hover-fill: #3a4422; transform-box: fill-box; transform-origin: center; transition: transform .2s ease, filter .2s ease; }
.box.gray { --glow: #ffffff; --hover-fill: #444444; }
.box.pink { --glow: #ff58af; --hover-fill: #4a2a3f; }
.box &gt; rect { transition: fill .2s ease; }
.box:hover:not(:has(.box:hover)) { transform: scale(1.04); filter: drop-shadow(0 0 10px var(--glow)); }
.box:hover:not(:has(.box:hover)) &gt; rect { fill: var(--hover-fill); }
@media (prefers-reduced-motion: reduce) { .box, .box &gt; rect { transition: none; } .box:hover { transform: none; } }

/* Flow effect: arrows march while the pointer is on the diagram. */
svg:hover .flow { stroke-dasharray: 12 6; animation: flow .8s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -18; } }
@media (prefers-reduced-motion: reduce) { svg:hover .flow { animation: none; stroke-dasharray: none; } }
</style><title id="title">An API for what SmartHR needs</title>
  <desc id="desc">SmartHR calls a wrapped image operation API to get a name, get image size, and perform other operations. The wrapper contains the CarrierWave API, keeping its details inside the compatibility layer.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ceff05" /></marker>
  </defs>
  <rect width="1100" height="460" rx="18" fill="#202020" fill-opacity="0.94" />
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff">
    <g class="box"><rect x="35" y="98" width="535" height="268" rx="134" fill="#30391c" stroke="#ceff05" stroke-width="3" />
    <text x="302" y="151" font-size="29" font-weight="700" fill="#ceff05">Wrapped Image Operation API</text>
    <g class="box gray"><rect x="91" y="187" width="317" height="137" rx="68" fill="#2f2f2f" stroke="#aaa" stroke-width="2" />
    <text x="249" y="244" font-size="32" font-weight="700">CarrierWave</text>
    <text x="249" y="287" font-size="32">API</text>
    </g></g><g class="box pink"><rect x="852" y="66" width="213" height="332" rx="14" fill="#2f2f2f" stroke="#ff58af" stroke-width="2" />
    <text x="958" y="200" font-size="31" font-weight="700">What</text>
    <text x="958" y="241" font-size="31" font-weight="700" fill="#ff58af">SmartHR</text>
    <text x="958" y="282" font-size="31" font-weight="700">Needs</text>
    </g><g fill="none" stroke="#ceff05" stroke-width="3" marker-end="url(#arrow)">
      <path d="M836 149 H579" class="flow" />
      <path d="M836 232 H585" class="flow" />
      <path d="M836 315 H579" class="flow" />
    </g>
    <rect x="635" y="130" width="149" height="36" rx="8" fill="#202020" />
      <rect x="600" y="213" width="216" height="36" rx="8" fill="#202020" />
      <rect x="670" y="296" width="78" height="36" rx="8" fill="#202020" />
    <text x="709" y="157" font-size="25">get name</text>
    <text x="708" y="240" font-size="25">get image size</text>
    <text x="709" y="323" font-size="25">etc.</text>
  </g>
</svg>