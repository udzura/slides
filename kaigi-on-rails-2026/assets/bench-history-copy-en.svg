<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">Time breakdown of submitting an application with an image</title>
<desc id="desc">Submitting an application that replaces a profile image, average of three local runs. Before: 17.0 s in total, with 39 GCS calls (put, delete, and copy 11 each; get and metadata 3 each). With duplicate-upload suppression: 9.6 s in total, with 22 GCS calls (put, delete, and copy 6 each; get and metadata 2 each).</desc>
