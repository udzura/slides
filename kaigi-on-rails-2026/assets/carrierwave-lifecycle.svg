<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">CarrierWaveのキャッシュ・永続化・復元</title>
<desc id="desc">cache!で一時保存しcache_idを生成。cache_nameはcache_idと元ファイル名からなる。バリデーションエラー後などはretrieve_from_cache!にcache_nameを渡して復元し保存を再開する。store!でキャッシュを永続化しidentifierを得る。その後はretrieve_from_store!にidentifierを渡し、store_dirなどの情報と合わせて保存済みファイルへの参照を復元する。</desc>
<style>
/* Hover effect: works only when embedded as an object element in a browser. Static in PDF and images. */
.box { --glow: #ceff05; --hover-fill: #3a4422; transform-box: fill-box; transform-origin: center; transition: transform .2s ease, filter .2s ease; }
.box.gray { --glow: #ffffff; --hover-fill: #444444; }
.box.pink { --glow: #ff58af; --hover-fill: #4a2a3f; }
.box rect { transition: fill .2s ease; }
.box:hover { transform: scale(1.04); filter: drop-shadow(0 0 10px var(--glow)); }
.box:hover rect { fill: var(--hover-fill); }
@media (prefers-reduced-motion: reduce) { .box, .box rect { transition: none; } .box:hover { transform: none; } }
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ceff05" /></marker><marker id="pink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ff58af" /></marker></defs>
<rect width="1100" height="470" rx="16" fill="#202020" fill-opacity="0.75" />
<g font-family="'Noto Sans JP','Hiragino Sans',sans-serif" fill="#fff" text-anchor="middle">
<g class="box"><rect x="30" y="18" width="585" height="65" rx="8" stroke="#ceff05" stroke-width="2" fill="#30391c" />
<text x="322" y="46" font-size="25" font-weight="700">① cache!：ファイルを一時保存</text>
<text x="322" y="71" font-size="19" fill="#ddd">cache_id を生成</text>
</g><g class="box"><rect x="30" y="105" width="585" height="65" rx="8" stroke="#ceff05" stroke-width="2" fill="#30391c" />
<text x="322" y="133" font-size="24" font-weight="700">② 再開に使う cache_name を保持</text>
<text x="322" y="159" font-size="20" fill="#ceff05">cache_id / 元ファイル名</text>
</g><g class="box"><rect x="30" y="205" width="585" height="65" rx="8" stroke="#ceff05" stroke-width="2" fill="#30391c" />
<text x="322" y="234" font-size="25" font-weight="700">③ store!：キャッシュから永続化</text>
<text x="322" y="259" font-size="19" fill="#ddd">保存先へコピー（設定・ストレージにより移動等）</text>
</g><g class="box"><rect x="30" y="292" width="585" height="60" rx="8" stroke="#ceff05" stroke-width="2" fill="#30391c" />
<text x="322" y="330" font-size="25" font-weight="700">④ identifier を得る（DBに保存する値）</text>
</g><g class="box"><rect x="30" y="374" width="585" height="76" rx="8" stroke="#ceff05" stroke-width="2" fill="#30391c" />
<text x="322" y="405" font-size="23" font-weight="700">⑤ retrieve_from_store!(identifier)</text>
<text x="322" y="434" font-size="20">保存済みファイルへの参照を復元 → URL・読み出し</text>
</g><g stroke="#ceff05" stroke-width="2" marker-end="url(#arrow)"><path d="M322 83 V103" /><path d="M322 170 V203" /><path d="M322 270 V290" /><path d="M322 352 V372" /></g>
<g class="box pink"><rect x="680" y="95" width="390" height="157" rx="8" fill="#432539" stroke="#ff58af" stroke-width="2" />
<text x="875" y="126" font-size="23" fill="#ff58af" font-weight="700">バリデーションエラー後などの再開</text>
<text x="875" y="163" font-size="24" font-weight="700">retrieve_from_cache!</text>
<text x="875" y="192" font-size="21">(cache_name)</text>
<text x="875" y="229" font-size="21">キャッシュ済みファイルを復元</text>
</g><path d="M615 137 H678" stroke="#ff58af" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#pink)" />
<path d="M680 220 H650 V187 H324" fill="none" stroke="#ff58af" stroke-width="2" marker-end="url(#pink)" />
<text x="875" y="300" font-size="20" fill="#ccc">cache_id ≠ モデルのID</text>
<text x="875" y="365" font-size="22" fill="#ceff05" font-weight="700">identifier だけでパスは決まらない</text>
<text x="875" y="397" font-size="21">store_dir などの情報も使って</text>
<text x="875" y="426" font-size="21">保存先を組み立てる</text>
</g></svg>