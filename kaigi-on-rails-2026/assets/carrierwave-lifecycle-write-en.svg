<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">Write: from the cache to persistent storage</title><desc id="desc">Write: from the cache to persistent storage</desc>
<style>
/* Hover effect: works only when embedded as an object element in a browser. Static in PDF and images. */
.box { --glow: #ceff05; --hover-fill: #3a4422; transform-box: fill-box; transform-origin: center; transition: transform .2s ease, filter .2s ease; }
.box.gray { --glow: #ffffff; --hover-fill: #444444; }
.box.pink { --glow: #ff58af; --hover-fill: #4a2a3f; }
.box rect { transition: fill .2s ease; }
.box:hover { transform: scale(1.04); filter: drop-shadow(0 0 10px var(--glow)); }
.box:hover rect { fill: var(--hover-fill); }
@media (prefers-reduced-motion: reduce) { .box, .box rect { transition: none; } .box:hover { transform: none; } }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ceff05"/></marker><marker id="pink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ff58af"/></marker></defs><rect width="1100" height="470" rx="16" fill="#202020" fill-opacity="0.75"/><g font-family="'Noto Sans JP','Hiragino Sans',sans-serif" fill="#fff" text-anchor="middle">
<g class="box"><rect x="35" y="20" width="590" height="80" rx="9" fill="#30391c" stroke="#ceff05" stroke-width="2"/>
<text x="330.0" y="52" font-size="25" fill="#ceff05" font-weight="700">① cache!: store the image temporarily</text>
<text x="330.0" y="82" font-size="20" fill="#fff" font-weight="400">Generates a cache_id and saves to cache_path</text>
</g>
<g class="box"><rect x="35" y="128" width="590" height="80" rx="9" fill="#30391c" stroke="#ceff05" stroke-width="2"/>
<text x="330.0" y="160" font-size="25" fill="#ceff05" font-weight="700">② Keep the cache_name</text>
<text x="330.0" y="190" font-size="20" fill="#fff" font-weight="400">cache_id / original filename (for resuming)</text>
</g>
<g class="box"><rect x="35" y="248" width="590" height="80" rx="9" fill="#30391c" stroke="#ceff05" stroke-width="2"/>
<text x="330.0" y="280" font-size="25" fill="#ceff05" font-weight="700">③ store!: persist the image</text>
<text x="330.0" y="310" font-size="20" fill="#fff" font-weight="400">Copied or moved from the cache to store_path</text>
</g>
<g class="box"><rect x="35" y="356" width="590" height="80" rx="9" fill="#30391c" stroke="#ceff05" stroke-width="2"/>
<text x="330.0" y="388" font-size="25" fill="#ceff05" font-weight="700">④ Save the identifier to the DB</text>
<text x="330.0" y="418" font-size="20" fill="#fff" font-weight="400">e.g., photo.jpg (an identifier, not the image)</text>
</g>
<path d="M330 100 V126" fill="none" stroke="#ceff05" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M330 208 V246" fill="none" stroke="#ceff05" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M330 328 V354" fill="none" stroke="#ceff05" stroke-width="2" marker-end="url(#arrow)"/>
<g class="box pink"><rect x="690" y="128" width="375" height="110" rx="9" fill="#432539" stroke="#ff58af" stroke-width="2"/>
<text x="877.5" y="160" font-size="25" fill="#ff58af" font-weight="700">When resuming a save</text>
<text x="877.5" y="190" font-size="20" fill="#fff" font-weight="400">retrieve_from_cache!(cache_name)</text>
</g>
<text x="877" y="218" font-size="20" fill="#fff" font-weight="400">Restores the cached image</text>
<path d="M625 168 H688" fill="none" stroke="#ff58af" stroke-width="2" marker-end="url(#pink)" stroke-dasharray="5 5"/>
<path d="M690 222 H660 V228 H332" fill="none" stroke="#ff58af" stroke-width="2" marker-end="url(#pink)"/>
<text x="870" y="300" font-size="23" fill="#ceff05" font-weight="700">cache and store are separate steps</text>
<text x="870" y="340" font-size="22" fill="#fff" font-weight="400">Image → storage</text>
<text x="870" y="379" font-size="22" fill="#fff" font-weight="400">identifier → DB</text>
<text x="550" y="460" font-size="16" fill="#ccc" font-weight="400">Conceptual diagram: the exact order of the DB write and store! depends on model callbacks</text>
</g></svg>