<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">From story to structured scenario, execution, observation, and report</title>
<desc id="desc">An AI structures the human-written story into scenario.yml while keeping it readable. Another AI runs it and records checks and observations in observation.yml. A reporting AI compares them with the expected results and writes a human-readable report with verdicts and reasons, which a human reviews in a PR.</desc>
<style>
/* Hover effect: works only when embedded as an object element in a browser. Static in PDF and images. */
.box { --glow: #ceff05; --hover-fill: #3a4422; transform-box: fill-box; transform-origin: center; transition: transform .2s ease, filter .2s ease; }
.box.gray { --glow: #ffffff; --hover-fill: #444444; }
.box.pink { --glow: #ff58af; --hover-fill: #4a2a3f; }
.box rect { transition: fill .2s ease; }
.box:hover { transform: scale(1.04); filter: drop-shadow(0 0 10px var(--glow)); }
.box:hover rect { fill: var(--hover-fill); }
@media (prefers-reduced-motion: reduce) { .box, .box rect { transition: none; } .box:hover { transform: none; } }
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ceff05" /></marker></defs>
<rect width="1100" height="460" rx="16" fill="#202020" />
<g font-family="'Noto Sans JP','Hiragino Sans',sans-serif" fill="#fff" text-anchor="middle">
<text x="125" y="57" font-size="21" fill="#ffffff" font-weight="700">Human</text>
<g class="box gray"><rect x="255" y="15" width="565" height="67" rx="9" fill="#2f2f2f" stroke="#ffffff" stroke-width="2" />
<text x="537" y="44" font-size="25" font-weight="700" fill="#ffffff">Write a story</text>
<text x="537" y="70" font-size="18">Preconditions, actions, and expected results in plain words</text>
</g><text x="955" y="55" font-size="18" fill="#ddd">Input</text>
<path d="M537 82 V97" stroke="#ceff05" stroke-width="2" marker-end="url(#arrow)" />
<text x="125" y="141" font-size="21" fill="#ceff05" font-weight="700">Structuring AI</text>
<g class="box"><rect x="255" y="99" width="565" height="67" rx="9" fill="#2f2f2f" stroke="#ceff05" stroke-width="2" />
<text x="537" y="128" font-size="25" font-weight="700" fill="#ceff05">Structure it, keeping it readable</text>
<text x="537" y="154" font-size="18">scenario.yml: steps, checks, expected results</text>
</g><text x="955" y="139" font-size="18" fill="#ddd">Stops instead of guessing</text>
<path d="M537 166 V181" stroke="#ceff05" stroke-width="2" marker-end="url(#arrow)" />
<text x="125" y="225" font-size="21" fill="#ff58af" font-weight="700">Another AI (executor)</text>
<g class="box pink"><rect x="255" y="183" width="565" height="67" rx="9" fill="#2f2f2f" stroke="#ff58af" stroke-width="2" />
<text x="537" y="212" font-size="25" font-weight="700" fill="#ff58af">Receive and run the scenario</text>
<text x="537" y="238" font-size="18">Browser actions, DOM, network logs, screenshots</text>
</g><text x="955" y="223" font-size="18" fill="#ddd">Passed via files and schemas</text>
<path d="M537 250 V265" stroke="#ceff05" stroke-width="2" marker-end="url(#arrow)" />
<text x="125" y="309" font-size="21" fill="#ff58af" font-weight="700">Executor’s output</text>
<g class="box pink"><rect x="255" y="267" width="565" height="67" rx="9" fill="#2f2f2f" stroke="#ff58af" stroke-width="2" />
<text x="537" y="296" font-size="25" font-weight="700" fill="#ff58af">Structure checks and observations</text>
<text x="537" y="322" font-size="18">observation.yml: observed facts and evidence</text>
</g><text x="955" y="307" font-size="18" fill="#ddd">No verdicts here</text>
<path d="M537 334 V349" stroke="#ceff05" stroke-width="2" marker-end="url(#arrow)" />
<text x="125" y="393" font-size="21" fill="#ceff05" font-weight="700">Reporting AI</text>
<g class="box"><rect x="255" y="351" width="565" height="67" rx="9" fill="#2f2f2f" stroke="#ceff05" stroke-width="2" />
<text x="537" y="380" font-size="25" font-weight="700" fill="#ceff05">Write a human-readable report</text>
<text x="537" y="406" font-size="18">Compare with expectations; give verdicts and reasons</text>
</g><text x="955" y="391" font-size="18" fill="#ddd">Human reviews it in a PR</text>
<text x="550" y="445" font-size="20" fill="#ceff05">Human-readable input → structured handoff → human-readable result</text></g></svg>