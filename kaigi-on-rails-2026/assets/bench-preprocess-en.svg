<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">Time breakdown of approving an application with images</title>
<desc id="desc">With all preprocessing, the total is 17.9 s: GCS operations 12.56 s, thumbnail resizing 2.27 s, getting the image size 1.42 s, EXIF operations 0.60 s, and other 1.10 s. Without preprocessing, the total is 5.8 s: GCS operations 4.96 s and other 0.85 s. Average of three local runs.</desc>
<style>
