.seg, .leg { transition: opacity .2s ease, filter .2s ease, transform .2s ease; transform-box: fill-box; }
.leg { transform-origin: left center; }
.seg { transform-origin: center; }
svg:has(.c0:hover) .seg:not(.c0), svg:has(.c0:hover) .leg:not(.c0) { opacity: .25; }
svg:has(.c0:hover) .seg.c0 { filter: drop-shadow(0 0 10px #ceff05); }
svg:has(.c0:hover) .leg.c0 { transform: scale(1.12); filter: drop-shadow(0 0 6px #ceff05); }
svg:has(.c1:hover) .seg:not(.c1), svg:has(.c1:hover) .leg:not(.c1) { opacity: .25; }
svg:has(.c1:hover) .seg.c1 { filter: drop-shadow(0 0 10px #ff2d8b); }
svg:has(.c1:hover) .leg.c1 { transform: scale(1.12); filter: drop-shadow(0 0 6px #ff2d8b); }
svg:has(.c2:hover) .seg:not(.c2), svg:has(.c2:hover) .leg:not(.c2) { opacity: .25; }
svg:has(.c2:hover) .seg.c2 { filter: drop-shadow(0 0 10px #ff58af); }
svg:has(.c2:hover) .leg.c2 { transform: scale(1.12); filter: drop-shadow(0 0 6px #ff58af); }
svg:has(.c3:hover) .seg:not(.c3), svg:has(.c3:hover) .leg:not(.c3) { opacity: .25; }
svg:has(.c3:hover) .seg.c3 { filter: drop-shadow(0 0 10px #ffb3d9); }
svg:has(.c3:hover) .leg.c3 { transform: scale(1.12); filter: drop-shadow(0 0 6px #ffb3d9); }
svg:has(.c4:hover) .seg:not(.c4), svg:has(.c4:hover) .leg:not(.c4) { opacity: .25; }
svg:has(.c4:hover) .seg.c4 { filter: drop-shadow(0 0 10px #8a8a8a); }
svg:has(.c4:hover) .leg.c4 { transform: scale(1.12); filter: drop-shadow(0 0 6px #8a8a8a); }
@media (prefers-reduced-motion: reduce) { .seg, .leg { transition: none; } }
