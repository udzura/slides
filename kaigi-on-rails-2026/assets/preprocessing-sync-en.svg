<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Synchronous image preprocessing</title><desc id="desc">The SmartHR Uploader resizes the uploaded file and uploads large, small, and thumbnail images to GCS synchronously.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ceff05"/></marker></defs><rect width="1100" height="360" rx="18" fill="#202020" fill-opacity="0.94"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff"><rect x="53" y="136" width="78" height="75" rx="8" fill="#383838" stroke="#ccc" stroke-width="2"/><circle cx="92" cy="159" r="10" fill="#ccc"/><path d="M74 189 Q74 171 92 171 Q110 171 110 189Z" fill="#ccc"/><text x="92" y="234" font-size="21" fill="#fff" font-weight="400">File</text><rect x="310" y="135" width="270" height="90" rx="12" fill="#303030" stroke="#ceff05" stroke-width="2"/><text x="445.0" y="170" font-size="25" fill="#ceff05" font-weight="700">SmartHR</text><text x="445.0" y="201" font-size="23" fill="#fff" font-weight="400">Uploader</text><path d="M148 180 H293" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="867" y="26" width="197" height="309" rx="24" fill="#2b2b2b" stroke="#aaa" stroke-width="2"/><text x="965" y="56" font-size="24" fill="#ceff05" font-weight="700">GCS</text><rect x="902" y="73" width="127" height="57" rx="9" fill="#383838" stroke="#ff83bd" stroke-width="2"/><text x="965" y="110" font-size="25" fill="#ff83bd" font-weight="700">large</text><rect x="902" y="158" width="127" height="57" rx="9" fill="#383838" stroke="#ceff05" stroke-width="2"/><text x="965" y="195" font-size="25" fill="#ceff05" font-weight="700">small</text><rect x="902" y="243" width="127" height="57" rx="9" fill="#383838" stroke="#fff" stroke-width="2"/><text x="965" y="280" font-size="25" fill="#fff" font-weight="700">thumb</text><path d="M596 157 H715 V101 H885" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M596 186 H885" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M596 213 H715 V271 H885" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="725" y="74" font-size="22" fill="#fff" font-weight="400">Resize + upload</text><text x="575" y="322" font-size="28" fill="#ff83bd" font-weight="700">All synchronously</text></g></svg>