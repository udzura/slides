<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><style>
/* Flow effect: arrows march while the pointer is on the diagram. */
svg:hover .flow { stroke-dasharray: 12 6; animation: flow .8s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -18; } }
@media (prefers-reduced-motion: reduce) { svg:hover .flow { animation: none; stroke-dasharray: none; } }

/* Hover effect: works only when embedded as an object element in a browser. Static in PDF and images. */
.box { --glow: #ceff05; --hover-fill: #3a4422; transform-box: fill-box; transform-origin: center; transition: transform .2s ease, filter .2s ease; }
.box.gray { --glow: #ffffff; --hover-fill: #444444; }
.box.pink { --glow: #ff58af; --hover-fill: #4a2a3f; }
.box &gt; rect { transition: fill .2s ease; }
.box:hover:not(:has(.box:hover)) { transform: scale(1.04); filter: drop-shadow(0 0 10px var(--glow)); }
.box:hover:not(:has(.box:hover)) &gt; rect { fill: var(--hover-fill); }
@media (prefers-reduced-motion: reduce) { .box, .box &gt; rect { transition: none; } .box:hover { transform: none; } }
</style><title id="title">Synchronous image preprocessing</title><desc id="desc">The SmartHR Uploader resizes the uploaded file and uploads large, small, and thumbnail images to GCS synchronously.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ceff05" /></marker></defs><rect width="1100" height="360" rx="18" fill="#202020" fill-opacity="0.94" /><g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff"><g class="box gray"><rect x="53" y="136" width="78" height="75" rx="8" fill="#2f2f2f" stroke="#ccc" stroke-width="2" /><circle cx="92" cy="159" r="10" fill="#ccc" /><path d="M74 189 Q74 171 92 171 Q110 171 110 189Z" fill="#ccc" /></g><text x="92" y="234" font-size="21" fill="#fff" font-weight="400">File</text><g class="box"><rect x="310" y="135" width="270" height="90" rx="12" fill="#2f2f2f" stroke="#ceff05" stroke-width="2" /><text x="445.0" y="170" font-size="25" fill="#ceff05" font-weight="700">SmartHR</text><text x="445.0" y="201" font-size="23" fill="#fff" font-weight="400">Uploader</text></g><path d="M148 180 H293" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" class="flow" /><g class="box gray"><rect x="867" y="26" width="197" height="309" rx="24" fill="#2f2f2f" stroke="#aaa" stroke-width="2" /><text x="965" y="56" font-size="24" fill="#ceff05" font-weight="700">GCS</text><g class="box pink"><rect x="902" y="73" width="127" height="57" rx="9" fill="#2f2f2f" stroke="#ff58af" stroke-width="2" /><text x="965" y="110" font-size="25" fill="#ff58af" font-weight="700">large</text></g><g class="box"><rect x="902" y="158" width="127" height="57" rx="9" fill="#2f2f2f" stroke="#ceff05" stroke-width="2" /><text x="965" y="195" font-size="25" fill="#ceff05" font-weight="700">small</text></g><g class="box gray"><rect x="902" y="243" width="127" height="57" rx="9" fill="#2f2f2f" stroke="#fff" stroke-width="2" /><text x="965" y="280" font-size="25" fill="#fff" font-weight="700">thumb</text></g></g><path d="M596 157 H715 V101 H885" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" class="flow" /><path d="M596 186 H885" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" class="flow" /><path d="M596 213 H715 V271 H885" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" class="flow" /><text x="725" y="74" font-size="22" fill="#fff" font-weight="400">Resize + upload</text><text x="575" y="322" font-size="28" fill="#ff58af" font-weight="700">All synchronously</text></g></svg>