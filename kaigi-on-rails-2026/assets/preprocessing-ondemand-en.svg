<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">On-demand image processing and CDN</title><desc id="desc">The uploader stores only the original in GCS. A dynamic resizer reads the original and generates sizes on demand. A CDN caches and serves the transformed images.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ceff05"/></marker></defs><rect width="1100" height="360" rx="18" fill="#202020" fill-opacity="0.94"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff"><rect x="53" y="42" width="78" height="75" rx="8" fill="#383838" stroke="#ccc" stroke-width="2"/><circle cx="92" cy="65" r="10" fill="#ccc"/><path d="M74 95 Q74 77 92 77 Q110 77 110 95Z" fill="#ccc"/><text x="92" y="140" font-size="21" fill="#fff" font-weight="400">File</text><rect x="310" y="41" width="270" height="88" rx="12" fill="#303030" stroke="#ceff05" stroke-width="2"/><text x="445.0" y="76" font-size="25" fill="#ceff05" font-weight="700">SmartHR</text><text x="445.0" y="107" font-size="23" fill="#fff" font-weight="400">Uploader</text><path d="M148 84 H293" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="860" y="23" width="205" height="99" rx="12" fill="#303030" stroke="#ceff05" stroke-width="2"/><text x="962.5" y="58" font-size="25" fill="#ceff05" font-weight="700">GCS</text><text x="962.5" y="89" font-size="23" fill="#fff" font-weight="400">original</text><path d="M596 84 H842" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="719" y="65" font-size="22" fill="#fff" font-weight="400">Upload original</text><path d="M963 137 V203" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="864" y="176" font-size="21" fill="#fff" font-weight="400">Read original</text><rect x="798" y="219" width="267" height="97" rx="12" fill="#303030" stroke="#ceff05" stroke-width="2"/><text x="931.5" y="254" font-size="25" fill="#ceff05" font-weight="700">Dynamic Resizer</text><text x="931.5" y="285" font-size="23" fill="#fff" font-weight="400">large / small / thumb</text><rect x="451" y="219" width="207" height="97" rx="12" fill="#303030" stroke="#ceff05" stroke-width="2"/><text x="554.5" y="254" font-size="25" fill="#ceff05" font-weight="700">CDN</text><text x="554.5" y="285" font-size="23" fill="#fff" font-weight="400">Cache + serve</text><path d="M782 267 H675" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="720" y="247" font-size="20" fill="#fff" font-weight="400">On demand</text><rect x="53" y="219" width="210" height="97" rx="12" fill="#303030" stroke="#aaa" stroke-width="2"/><text x="158.0" y="254" font-size="25" fill="#aaa" font-weight="700">Browser</text><text x="158.0" y="285" font-size="23" fill="#fff" font-weight="400">Image response</text><path d="M435 267 H280" fill="none" stroke="#ceff05" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="357" y="247" font-size="21" fill="#fff" font-weight="400">Deliver</text></g></svg>