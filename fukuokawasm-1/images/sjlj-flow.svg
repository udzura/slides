<svg xmlns="http://www.w3.org/2000/svg" class="sjlj-flow" viewBox="0 0 1120 336" width="1120" height="336" role="group" aria-labelledby="sjlj-title sjlj-desc">
  <title id="sjlj-title">setjmpからlongjmp、Wasm EHによる捕捉と復帰まで</title>
  <desc id="sjlj-desc">上段を左から右へ呼び出し、下段を右から左へ復帰する。setjmpで戻り先を記録し、jumpからlongjmpと__wasm_longjmpを呼ぶ。throwで送出した例外をtry_tableで捕捉して戻り先を照合し、setjmpが42を返した経路を続行する。</desc>
  <style>
    svg.sjlj-flow { display:block; width:100%; max-width:100%; height:auto; overflow:visible; }
    .sjlj-flow text { fill:#252924; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; letter-spacing:0; pointer-events:none; }
    .sjlj-flow .row-label { font-size:17px; fill:#686c63; }
    .sjlj-flow .node-bg { fill:#eeeee4; stroke:#d5d7cd; stroke-width:1; transition:fill 120ms ease,stroke 120ms ease; }
    .sjlj-flow .node-mark { fill:#b53d27; opacity:.35; pointer-events:none; transition:opacity 120ms ease; }
    .sjlj-flow .node-heading { font-size:18px; fill:#686c63; }
    .sjlj-flow .node-code { font-family:Menlo,monospace; font-size:22px; }
    .sjlj-flow .node-detail { font-size:19px; }
    .sjlj-flow .node-detail.code { font-family:Menlo,monospace; font-size:19px; }
    .sjlj-flow .flow-node { outline:none; }
    .sjlj-flow .flow-node:focus-visible .node-bg { fill:#fffdf9; stroke:#b53d27; stroke-width:2; }
    .sjlj-flow .flow-node:focus-visible .node-mark { opacity:1; }
    .sjlj-flow:has(.flow-node:focus-visible) .flow-node:not(:focus-visible) .node-bg { fill:#d3d5c9; }
    .sjlj-flow .edge { fill:none; stroke:#686c63; stroke-width:2; marker-end:url(#sjlj-arrow); }
    .sjlj-flow .edge.return { stroke:#b53d27; marker-end:url(#sjlj-arrow-return); }
    .sjlj-flow .edge.unwind { stroke-dasharray:6 5; }
    @media (hover:hover) {
      .sjlj-flow:has(.flow-node:hover) .node-bg { fill:#d3d5c9; }
      .sjlj-flow .flow-node:hover .node-bg { fill:#fffdf9; stroke:#b53d27; stroke-width:2; }
      .sjlj-flow .flow-node:hover .node-mark { opacity:1; }
    }
    @media (prefers-reduced-motion:reduce) {
      .sjlj-flow .node-bg,.sjlj-flow .node-mark { transition:none; }
    }
    @media print {
      .sjlj-flow .flow-node .node-bg { fill:#eeeee4 !important; stroke:#d5d7cd !important; stroke-width:1 !important; }
      .sjlj-flow .flow-node .node-mark { opacity:.35 !important; }
    }
  </style>
  <defs>
    <marker id="sjlj-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#686c63" stroke-width="1.5" />
    </marker>
    <marker id="sjlj-arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b53d27" stroke-width="1.5" />
    </marker>
  </defs>
  <g aria-hidden="true">
    <text class="row-label" x="0" y="16">呼び出し →</text>
    <text class="row-label" x="0" y="198">← 例外の伝播・復帰</text>
    <path class="edge" d="M 334 84 H 388" />
    <path class="edge" d="M 732 84 H 786" />
    <path class="edge" d="M 958 150 V 200" />
    <path class="edge return unwind" d="M 786 266 H 732" />
    <path class="edge return" d="M 388 266 H 334" />
  </g>
  <g class="flow-node" tabindex="0" role="group" aria-label="1. setjmpで戻り先を記録。初回は0を返す。">
    <rect class="node-bg" x="0" y="28" width="324" height="112" />
    <rect class="node-mark" x="0" y="28" width="3" height="112" />
    <text class="node-heading" x="20" y="54">1　戻り先を記録</text>
    <text class="node-code" x="20" y="91">setjmp(env) → 0</text>
    <text class="node-detail" x="20" y="119">probe() の初回実行</text>
  </g>
  <g class="flow-node" tabindex="0" role="group" aria-label="2. jumpからlongjmp(env, 42)を呼び、非局所ジャンプを要求する。">
    <rect class="node-bg" x="398" y="28" width="324" height="112" />
    <rect class="node-mark" x="398" y="28" width="3" height="112" />
    <text class="node-heading" x="418" y="54">2　ジャンプを要求</text>
    <text class="node-code" x="418" y="91">jump()</text>
    <text class="node-detail code" x="418" y="119">longjmp(env, 42)</text>
  </g>
  <g class="flow-node" tabindex="0" role="group" aria-label="3. ランタイム関数__wasm_longjmp(env, 42)を呼ぶ。">
    <rect class="node-bg" x="796" y="28" width="324" height="112" />
    <rect class="node-mark" x="796" y="28" width="3" height="112" />
    <text class="node-heading" x="816" y="54">3　ランタイムへ</text>
    <text class="node-code" x="816" y="91">__wasm_longjmp</text>
    <text class="node-detail code" x="816" y="119">(env, 42)</text>
  </g>
  <g class="flow-node" tabindex="0" role="group" aria-label="4. throw命令でジャンプ先などの情報を載せた例外を送出する。">
    <rect class="node-bg" x="796" y="210" width="324" height="112" />
    <rect class="node-mark" x="796" y="210" width="3" height="112" />
    <text class="node-heading" x="816" y="236">4　Wasmの例外を送出</text>
    <text class="node-code" x="816" y="273">throw</text>
    <text class="node-detail" x="816" y="301">ジャンプ先などの情報を載せる</text>
  </g>
  <g class="flow-node" tabindex="0" role="group" aria-label="5. コンパイラがprobeに生成したtry_tableで捕捉し、戻り先を照合する。">
    <rect class="node-bg" x="398" y="210" width="324" height="112" />
    <rect class="node-mark" x="398" y="210" width="3" height="112" />
    <text class="node-heading" x="418" y="236">5　probe() 側で捕捉</text>
    <text class="node-code" x="418" y="273">try_table</text>
    <text class="node-detail" x="418" y="301">戻り先がこの関数か照合する</text>
  </g>
  <g class="flow-node" tabindex="0" role="group" aria-label="6. setjmpが42を返した経路へ復帰し、case 42の処理を続ける。">
    <rect class="node-bg" x="0" y="210" width="324" height="112" />
    <rect class="node-mark" x="0" y="210" width="3" height="112" />
    <text class="node-heading" x="20" y="236">6　保存した経路へ復帰</text>
    <text class="node-code" x="20" y="273">setjmp(env) → 42</text>
    <text class="node-detail" x="20" y="301">case 42 の処理を続ける</text>
  </g>
</svg>
