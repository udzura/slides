<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">Fixing cache_path: before</title>
<desc id="desc">At cache creation, the file is saved to Path A. When restoring with the same ID, if the logic or inputs have changed, the app looks at Path B and cannot reach the file that remains at Path A.</desc>
<style>
/* Hover effect: works only when embedded as an object element in a browser. Static in PDF and images. */
.box { --glow: #ceff05; --hover-fill: #3a4422; transform-box: fill-box; transform-origin: center; transition: transform .2s ease, filter .2s ease; }
.box.gray { --glow: #ffffff; --hover-fill: #444444; }
.box.pink { --glow: #ff58af; --hover-fill: #4a2a3f; }
.box rect { transition: fill .2s ease; }
.box:hover { transform: scale(1.04); filter: drop-shadow(0 0 10px var(--glow)); }
.box:hover rect { fill: var(--hover-fill); }
@media (prefers-reduced-motion: reduce) { .box, .box rect { transition: none; } .box:hover { transform: none; } }

/* Flow effect: arrows march while the pointer is on the diagram. */
svg:hover .flow { stroke-dasharray: 12 6; animation: flow .8s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -18; } }
@media (prefers-reduced-motion: reduce) { svg:hover .flow { animation: none; stroke-dasharray: none; } }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ff58af" /></marker></defs><rect width="1100" height="460" rx="16" fill="#202020" fill-opacity="0.94" /><g font-family="'Noto Sans JP','Hiragino Sans',sans-serif" text-anchor="middle" fill="#fff">
<text x="155" y="43" font-size="25" fill="#ceff05" font-weight="700">① On cache creation</text>
<text x="155" y="241" font-size="25" fill="#ff58af" font-weight="700">② On restore</text>
<path d="M265 115 H361" fill="none" stroke="#ff58af" stroke-width="3" marker-end="url(#arrow)" class="flow" />
<path d="M715 115 H816" fill="none" stroke="#ff58af" stroke-width="3" marker-end="url(#arrow)" class="flow" />
<path d="M265 310 H361" fill="none" stroke="#ff58af" stroke-width="3" marker-end="url(#arrow)" class="flow" />
<path d="M715 310 H816" fill="none" stroke="#ff58af" stroke-width="3" marker-end="url(#arrow)" class="flow" />
<g class="box gray">
<rect x="35" y="65" width="230" height="100" rx="10" fill="#2f2f2f" stroke="#aaa" stroke-width="2" />
<text x="150" y="104" font-size="23" fill="#fff" font-weight="400">Cache ID</text>
<text x="150" y="141" font-size="25" fill="#ceff05" font-weight="700">Same ID: C123</text>
</g>
<g class="box">
<rect x="365" y="65" width="350" height="100" rx="10" fill="#2f2f2f" stroke="#ceff05" stroke-width="2" />
<text x="540" y="103" font-size="22" fill="#ceff05" font-weight="700">Calculated from current state</text>
<text x="540" y="140" font-size="23" fill="#fff" font-weight="400">Result: Path A</text>
</g>
<g class="box">
<rect x="820" y="65" width="245" height="100" rx="10" fill="#2f2f2f" stroke="#ceff05" stroke-width="2" />
<text x="942" y="104" font-size="27" fill="#ceff05" font-weight="700">Path A</text>
<text x="942" y="141" font-size="21" fill="#fff" font-weight="400">File saved</text>
</g>
<g class="box gray">
<rect x="35" y="260" width="230" height="100" rx="10" fill="#2f2f2f" stroke="#aaa" stroke-width="2" />
<text x="150" y="299" font-size="23" fill="#fff" font-weight="400">Cache ID</text>
<text x="150" y="336" font-size="25" fill="#ceff05" font-weight="700">Same ID: C123</text>
</g>
<g class="box pink">
<rect x="365" y="260" width="350" height="100" rx="10" fill="#2f2f2f" stroke="#ff58af" stroke-width="2" />
<text x="540" y="298" font-size="22" fill="#ff58af" font-weight="700">Recalculated at restore</text>
<text x="540" y="335" font-size="23" fill="#fff" font-weight="400">Result: Path B</text>
</g>
<g class="box pink">
<rect x="820" y="260" width="245" height="100" rx="10" fill="#2f2f2f" stroke="#ff58af" stroke-width="2" />
<text x="942" y="299" font-size="27" fill="#ff58af" font-weight="700">Path B</text>
<text x="942" y="336" font-size="19" fill="#fff" font-weight="400">File not found</text>
</g>
<text x="550" y="207" font-size="23" fill="#ff58af" font-weight="400">If the logic or inputs change in between…</text>
<text x="550" y="408" font-size="25" fill="#ff58af" font-weight="700">Same ID, wrong location. The file is still at Path A</text>
<text x="550" y="441" font-size="17" fill="#ccc" font-weight="400">Conceptual diagram: IDs and paths are examples. The ID identifies the cache, not the model.</text>
</g></svg>